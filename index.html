<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155eef">
<title>沪教版数学四年级下册｜知识卡片复习</title>
<style>
:root{--b:#155eef;--ink:#14213d;--muted:#66758f;--bg:#f5f8fc;--line:#e4eaf4;--ok:#07865b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eaf3ff,#f7f9fd 380px);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.wrap{max-width:1080px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.brand{display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#155eef,#7461ff);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900;box-shadow:0 10px 25px #155eef40}.eyebrow{font-size:13px;font-weight:800;color:var(--b);letter-spacing:.08em}.title{font-size:clamp(22px,4vw,34px);line-height:1.2;margin:3px 0}.sub{font-size:14px;color:var(--muted);margin:0}.btn{border:0;border-radius:12px;padding:11px 15px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer;box-shadow:0 5px 15px #1c2c4a12}.btn:hover{transform:translateY(-1px)}.primary{background:var(--b);color:#fff}.ghost{border:1px solid var(--line);box-shadow:none}.hero{display:grid;grid-template-columns:1.35fr .85fr;gap:18px;margin-top:24px}.panel{background:#fff;border:1px solid #ffffffaa;border-radius:22px;box-shadow:0 17px 40px #173c7414}.intro{padding:26px;background:radial-gradient(circle at 94% 0,#dceaff 0,transparent 38%),#fff}.intro h2{margin:0;font-size:23px}.intro p,.daily p{color:var(--muted);line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:13px;background:#f6f8fc;border-radius:15px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}.daily{padding:22px}.daily h3{margin:0}.bar{height:9px;background:#e9eef8;border-radius:99px;overflow:hidden;margin:15px 0 8px}.bar i{height:100%;width:0;display:block;background:linear-gradient(90deg,#155eef,#7561ff);transition:.3s}.smallline{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.main{display:grid;grid-template-columns:250px 1fr;gap:18px;margin-top:18px}.side{padding:12px;height:max-content;position:sticky;top:12px}.sideTitle{color:#7a889d;font-size:12px;letter-spacing:.08em;font-weight:900;margin:5px 8px 9px}.topic{width:100%;border:0;text-align:left;background:transparent;padding:11px 12px;border-radius:11px;cursor:pointer;color:#45546d;font-weight:750}.topic:hover,.topic.active{background:#edf4ff;color:var(--b)}.topic em{float:right;font-style:normal;font-size:12px;opacity:.72}.study{padding:22px}.studyhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.crumb{font-size:13px;color:var(--b);font-weight:850}.cardtitle{font-size:19px;font-weight:850;margin-top:4px}.counter{font-size:13px;color:var(--muted)}.card{min-height:370px;padding:27px;border-radius:20px;border:1px solid #e8edf6;background:linear-gradient(145deg,#fff,#fbfcff);display:flex;flex-direction:column;justify-content:space-between}.tag{display:inline-flex;align-self:flex-start;border-radius:999px;padding:7px 10px;background:#edf4ff;color:var(--b);font-size:12px;font-weight:850}.question{font-size:clamp(24px,3.4vw,33px);line-height:1.42;margin:22px 0 8px}.hint{line-height:1.8;color:var(--muted)}.answer{display:none;margin-top:18px;padding:16px;border:1px solid #dceaff;background:#f6faff;border-radius:15px;line-height:1.8}.answer.show{display:block}.answer strong{color:var(--b)}.answer ul{padding-left:20px;margin:8px 0 0}.quiz{margin-top:16px;padding:16px;border:1px dashed #cad8ea;border-radius:15px}.quiz b{display:block;margin-bottom:9px}.opt{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;margin:7px 0;text-align:left;color:#34425b;font-weight:700;cursor:pointer}.opt:hover{border-color:#a6c0ff}.correct{border-color:#74d4aa;background:#edfcf4;color:#08764f}.wrong{border-color:#efb5b5;background:#fff4f4;color:#be3c3c}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.nav{display:flex;gap:9px}.mastered{background:#eafaf3;color:var(--ok)}.note{color:#8190a5;font-size:12px;line-height:1.7;margin:16px 2px 0}.modal{display:none;position:fixed;inset:0;background:#10254e88;place-items:center;padding:18px;z-index:10}.modal.show{display:grid}.dialog{width:min(520px,100%);background:#fff;border-radius:22px;padding:25px;box-shadow:0 30px 80px #15264e55}.dialog h3{margin:0}.dialog p{color:var(--muted);line-height:1.75}.check{list-style:none;padding:0;margin:12px 0}.check li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}.badge{font-size:12px;background:#eef2f8;border-radius:99px;padding:4px 8px;color:#68768c}@media(max-width:760px){.wrap{padding:18px 13px 46px}.top{align-items:flex-start}.top .btn{padding:9px 11px}.hero,.main{grid-template-columns:1fr}.side{position:static;display:flex;gap:8px;overflow:auto;white-space:nowrap;padding:9px}.sideTitle{display:none}.topic{width:auto;flex:none}.study{padding:15px}.card{padding:20px;min-height:420px}.actions{flex-direction:column-reverse}.nav{justify-content:space-between}.nav .btn{flex:1}.intro,.daily{padding:20px}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand"><div class="logo">数</div><div><div class="eyebrow">沪教版 · 四年级下册</div><h1 class="title">数学期末知识卡片复习</h1><p class="sub">逐张学习 · 即时自测 · 本地保存学习进度</p></div></div><button class="btn ghost" id="reset">重置进度</button></header>
<section class="hero"><div class="panel intro"><h2>把整册知识拆成可掌握的小卡片</h2><p>每次只复习一个概念：先独立思考，再展开答案；完成后标记“已掌握”。适合 iPad、手机和电脑浏览。</p><div class="stats"><div class="stat"><b id="total">0</b><span>知识卡片</span></div><div class="stat"><b id="master">0</b><span>已掌握</span></div><div class="stat"><b id="score">0%</b><span>自测正确率</span></div></div></div><div class="panel daily"><h3>今日学习建议</h3><p id="advice">先完成 8 张卡片，再做几道小测验。</p><div class="bar"><i id="bar"></i></div><div class="smallline"><span id="progress">0 / 0 已掌握</span><span>循序渐进</span></div><button class="btn primary" id="start" style="width:100%;margin-top:15px">开始逐卡复习</button></div></section>
<section class="main"><aside class="panel side" id="topics"></aside><section class="panel study"><div class="studyhead"><div><div class="crumb" id="crumb">知识卡片</div><div class="cardtitle" id="ctitle">准备开始</div></div><div class="counter" id="counter"></div></div><article class="card" id="card"></article><p class="note">提示：进度仅保存在当前浏览器；清除浏览器数据或点击“重置进度”会清空记录。</p></section></section></main>
<div class="modal" id="modal"><div class="dialog"><h3>学习概览</h3><p>按章节逐卡复习，完成情况会保存在当前设备。</p><ul class="check" id="check"></ul><button class="btn primary" style="width:100%;margin-top:12px" id="close">开始学习</button></div></div>
<script>
const C=[
['第一单元·复习与提高','四则混合运算顺序','没有括号的算式，应该按什么顺序计算？','先算乘、除法，后算加、减法；同一级运算从左往右依次计算。',['例：48 ÷ 6 + 7 × 3 = 8 + 21 = 29','先把算式看完整，再按顺序写出每一步。'],'36 ÷ 4 + 5 × 2 的结果是？',['28','19','15'],1],
['第一单元·复习与提高','带括号的运算','算式里既有小括号又有中括号时，先算哪里？','先算小括号里面的，再算中括号里面的，最后算括号外面的。',['例：[48 − (19 + 7)] × 2 = 44','括号不能漏抄，完成一步就写清楚。'],'[30 − (8 + 7)] × 2 = ?',['15','30','45'],1],
['第一单元·复习与提高','加法交换律与结合律','怎样用运算定律让加法算得更快？','加法交换律：a + b = b + a；加法结合律：(a + b) + c = a + (b + c)。',['例：38 + 67 + 62 = (38 + 62) + 67 = 167','优先凑整。'],'28 + 46 + 72 最简便的是？',['(28+72)+46','28+(46+72)','都可以，但第一种更易凑整'],2],
['第一单元·复习与提高','乘法分配律','什么是乘法分配律？','a × (b + c) = a × b + a × c；a × (b − c) = a × b − a × c。',['例：25 × 36 = 25 × (40 − 4) = 900','括号外的数要分配给每一项。'],'12 × 19 可以改写为？',['12×20−12','12×20−19','(12−1)×19'],0],
['第一单元·复习与提高','除法性质','连续除以两个数，可以怎样简便计算？','a ÷ b ÷ c = a ÷ (b × c)，其中 b、c 都不为 0。',['例：960 ÷ 8 ÷ 5 = 960 ÷ 40 = 24','不能写成 a ÷ (b ÷ c)。'],'720 ÷ 9 ÷ 2 = ?',['40','160','80'],0],
['第二单元·小数','小数的组成','3.506 中，各个数字分别表示什么？','3 表示 3 个一；5 表示 5 个十分之一；0 表示 0 个百分之一；6 表示 6 个千分之一。',['小数点右边第一位是十分位，第二位是百分位。','读小数时，小数点读作“点”。'],'0.47 里面有几个百分之一？',['4','7','47'],2],
['第二单元·小数','小数大小比较','比较小数大小，先比较哪里？','先比较整数部分；整数部分相同，再依次比较十分位、百分位。',['例：4.09 < 4.1，因为 4.1 = 4.10','可在末尾添 0 后比较。'],'下面哪个数最大？',['2.305','2.35','2.303'],1],
['第二单元·小数','小数的基本性质','小数末尾添上 0 或去掉 0，大小会变吗？','小数的末尾添上 0 或去掉 0，小数的大小不变。',['5.8 = 5.80 = 5.800','不能删中间的 0：3.05 不能写成 3.5。'],'与 7.20 相等的是？',['7.2','7.02','7.2002'],0],
['第二单元·小数','小数点移动规律','小数点向右或向左移动一位，数会怎样变化？','向右移动一位扩大到原来的 10 倍；向左移动一位缩小到原来的十分之一。',['0.36 × 10 = 3.6','5.4 ÷ 100 = 0.054。'],'6.25 ÷ 100 = ?',['0.625','0.0625','0.00625'],1],
['第二单元·小数','小数加减法','小数加减法的关键步骤是什么？','列竖式时小数点必须对齐；按整数加减法计算；结果的小数点与上面的小数点对齐。',['8.4 + 2.36 要写成 8.40 + 2.36','可用加减法互相验算。'],'5.6 − 2.38 = ?',['3.22','3.28','3.18'],0],
['第三单元·折线统计图','折线统计图的作用','折线统计图最适合表示什么？','适合表示数量随时间或顺序变化的情况，便于观察上升、下降和变化快慢。',['先读标题、横轴和纵轴。','再读刻度和趋势。'],'要表示一周气温的变化，最适合用？',['条形统计图','折线统计图','圆形统计图'],1],
['第三单元·折线统计图','读图三步法','读一幅折线统计图时，可以按哪三步？','先读标题、单位和图例；再读具体数据；最后概括变化趋势。',['注意纵轴每格代表多少。','常考：最多、最少、相差、增加多少。'],'每格表示 5 人，相邻两点相差 3 格，人数相差？',['8人','15人','3人'],1],
['第四单元·垂直与平行','垂直','什么叫两条直线互相垂直？','两条直线相交成直角时，这两条直线互相垂直；交点叫垂足。',['可用三角尺的直角检验。','相交但不是直角，不叫垂直。'],'相交形成 90° 的两条直线关系是？',['平行','垂直','重合'],1],
['第四单元·垂直与平行','平行线','什么叫平行线？','在同一平面内，不相交的两条直线叫平行线。',['平行线之间的距离处处相等。','延长后相交的线不是平行线。'],'哪种说法正确？',['两条不相交的线一定平行','同一平面内两条不相交的直线互相平行','平行线一定会相交'],1],
['第四单元·垂直与平行','垂线段最短','从直线外一点向直线画几条线段，哪一条最短？','从直线外一点到这条直线所画的线段中，垂线段最短。',['垂线段长度就是点到直线的距离。','画图时标出直角符号。'],'点到直线的距离，指的是？',['任意线段长度','垂线段长度','最长线段长度'],1],
['第五单元·近似数与位置','四舍五入求近似数','把 8.746 保留到十分位，怎样做？','看百分位。8.746 的百分位是 4，舍去后得到 8.7。',['看的是要保留数位的下一位。','保留整数看十分位。'],'3.86 保留到十分位约是？',['3.8','3.9','4.0'],1],
['第五单元·近似数与位置','数对表示位置','数对 (3, 5) 表示什么位置？','第一个数表示横向第几列，第二个数表示纵向第几行。',['通常写作（列，行）。','(3,5) 与 (5,3) 表示不同位置。'],'数对 (2,4) 中，4 表示？',['第4列','第4行','第4个点'],1],
['期末综合','解决问题的检查','应用题完成后，至少检查哪三件事？','检查数量关系是否符合题意；单位是否一致；答案是否合理，并写完整答句。',['“比……多/少”“每……多少”“一共”要先判断运算。','遇到余数要结合题意判断是否进一。'],'计算得到“买 3.2 本书”，这说明？',['结果一定正确','需结合题意处理，通常进一或检查','可以直接写 3.2 本'],1]
].map(([unit,title,q,a,points,quiz,opt,right])=>({unit,title,q,a,points,quiz,opt,right}));
let S=JSON.parse(localStorage.getItem('joyeeMath4Cards')||'{"m":[],"a":{},"topic":"全部","i":0}');const $=x=>document.querySelector(x);const topics=['全部',...new Set(C.map(x=>x.unit))];const list=()=>S.topic==='全部'?C:C.filter(x=>x.unit===S.topic);const save=()=>localStorage.setItem('joyeeMath4Cards',JSON.stringify(S));
function topicUI(){const box=$('#topics');box.innerHTML='<div class="sideTitle">按单元复习</div>'+topics.map(t=>`<button class="topic ${S.topic===t?'active':''}" data-t="${t}">${t}<em>${t==='全部'?C.length:C.filter(x=>x.unit===t).length}</em></button>`).join('');box.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{S.topic=b.dataset.t;S.i=0;save();render()})}
function stats(){const ans=Object.entries(S.a).filter(([,v])=>v.c!==undefined),right=ans.filter(([i,v])=>C[i].right===v.c).length,p=Math.round(S.m.length/C.length*100);$('#total').textContent=C.length;$('#master').textContent=S.m.length;$('#score').textContent=ans.length?Math.round(right/ans.length*100)+'%':'0%';$('#bar').style.width=p+'%';$('#progress').textContent=`${S.m.length} / ${C.length} 已掌握`;$('#advice').textContent=S.m.length===C.length?'太棒了，全部卡片都已掌握。可重置进度开启下一轮。':`已掌握 ${S.m.length} 张。今天再完成 ${Math.min(8,C.length-S.m.length)} 张，稳步提升。`}
function quiz(c,i,v){return `<div class="quiz"><b>小测验：${c.quiz}</b>${c.opt.map((x,n)=>`<button class="opt ${v.c===n?(n===c.right?'correct':'wrong'):''}" data-o="${n}">${String.fromCharCode(65+n)}. ${x}</button>`).join('')}${v.c!==undefined?`<div style="margin-top:8px;font-size:13px;color:${v.c===c.right?'#07865b':'#be3c3c'}">${v.c===c.right?'回答正确！':'再想一想，正确答案是 '+String.fromCharCode(65+c.right)+'。'}</div>`:''}</div>`}
function render(){const L=list();S.i=Math.max(0,Math.min(S.i,L.length-1));const c=L[S.i],i=C.indexOf(c),v=S.a[i]||{},m=S.m.includes(i);$('#crumb').textContent=c.unit;$('#ctitle').textContent=c.title;$('#counter').textContent=`第 ${S.i+1} / ${L.length} 张`;$('#card').innerHTML=`<div><span class="tag">${c.unit}</span><h2 class="question">${c.q}</h2><p class="hint">先自己想一想，再展开答案。</p><div class="answer ${v.show?'show':''}"><strong>答案与要点</strong><div>${c.a}</div><ul>${c.points.map(x=>`<li>${x}</li>`).join('')}</ul></div>${v.show?quiz(c,i,v):''}</div><div class="actions"><button class="btn ${m?'mastered':''}" id="m">${m?'✓ 已掌握':'标记为已掌握'}</button><div class="nav"><button class="btn ghost" id="prev">← 上一张</button><button class="btn primary" id="next">下一张 →</button></div></div>`;if(!v.show){$('.hint').insertAdjacentHTML('afterend','<button class="btn primary" id="show" style="margin-top:13px">展开答案</button>');$('#show').onclick=()=>{S.a[i]={show:true};save();render()}}$('#m').onclick=()=>{S.m=m?S.m.filter(x=>x!==i):[...S.m,i];save();render()};$('#prev').onclick=()=>{S.i=(S.i-1+L.length)%L.length;save();render()};$('#next').onclick=()=>{S.i=(S.i+1)%L.length;save();render()};if(v.show)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.a[i].c!==undefined)return;S.a[i].c=+b.dataset.o;save();render()});topicUI();stats()}
function overview(){let g={};C.forEach((c,i)=>{g[c.unit]??=[0,0];g[c.unit][0]++;if(S.m.includes(i))g[c.unit][1]++});$('#check').innerHTML=Object.entries(g).map(([k,v])=>`<li><span>${k}</span><span class="badge">${v[1]}/${v[0]} 已掌握</span></li>`).join('');$('#modal').classList.add('show')}$(' #start'.trim()).onclick=overview;$('#close').onclick=()=>{$('#modal').classList.remove('show');$('.main').scrollIntoView({behavior:'smooth'})};$('#reset').onclick=()=>{if(confirm('确定清空本设备学习进度吗？')){S={m:[],a:{},topic:'全部',i:0};save();render()}};render();
</script></body></html>
